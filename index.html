<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Strict 15-day Project Executive preparation mission">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>JOB MISSION 15</title>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">SATHYAM SMART FARM</div>
    <h1>JOB MISSION <span>15</span></h1>
    <p>Project Executive • Strict Training System</p>
  </header>

  <section class="hero">
    <div class="hero-top">
      <div>
        <small>MISSION PROGRESS</small>
        <strong id="percent">0%</strong>
      </div>
      <div class="streak">🔥 <b id="streak">0</b> day streak</div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="stats">
      <div><b id="done">0</b><small>DONE</small></div>
      <div><b id="left">15</b><small>LEFT</small></div>
      <div><b id="missed">0</b><small>MISSED</small></div>
    </div>
  </section>

  <section class="controls">
    <button id="notifyBtn" class="primary">🔔 Enable Notifications</button>
    <button id="installBtn" class="secondary" hidden>📲 Install App</button>
  </section>

  <div id="todayAlert"></div>
  <main id="taskList"></main>

  <section id="completeScreen" class="complete" hidden>
    <div>🏆</div>
    <h2>MISSION COMPLETE</h2>
    <p>15/15 tasks completed. You are job-ready for the Project Executive preparation plan.</p>
  </section>

  <footer>Progress is saved on this device.</footer>
</div>
<script src="app.js"></script>
</body>
</html>
